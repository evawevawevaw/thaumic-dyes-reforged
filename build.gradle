plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = 'thaumicdyes'
base { archivesName = 'thaumic-dyes-reforged' }
java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version))
repositories {
    maven {
        url = 'https://maven.minecraftforge.net/'
        content { includeGroup 'com.github.glitchfiend' }
    }
    maven {
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
}
neoForge {
    version = project.neo_version
    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }
    mods {
        thaumicdyes { sourceSet(sourceSets.main) }
    }
}
// Thaumcraft remains external. Configure its jar without requiring the porting workspace.
def thaumcraftJarPath = providers.gradleProperty('thaumcraft_jar')
    .orElse(providers.environmentVariable('THAUMCRAFT_JAR'))
    .orElse('libs/thaumcraft-4-reforged-1.1.3-1.21.1.jar')
def thaumcraftJar = file(thaumcraftJarPath.get())
if (!thaumcraftJar.isFile()) {
    throw new GradleException("Thaumcraft Reforged jar not found: ${thaumcraftJar}. Set THAUMCRAFT_JAR or -Pthaumcraft_jar, or place the jar in libs/.")
}
dependencies {
    implementation files(thaumcraftJar)
    implementation "com.github.glitchfiend:TerraBlender-neoforge:${terrablender_version}"
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
}
tasks.named('processResources', ProcessResources) {
    inputs.property('mod_version', project.version)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(mod_version: project.version)
    }
}
tasks.named('jar', Jar) {
    archiveFileName = "thaumic-dyes-reforged-${mod_version}-${minecraft_version}.jar"
    from('NOTICE')
    from('LICENSE')
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
